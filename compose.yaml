# docker compose up -d   (settings in .env, see .env.example)
services:
  share:
    image: ${FLASHCERT_SHARE_IMAGE:-ghcr.io/valkea/flashcert-share:latest}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Only the host's reverse proxy reaches it; change to "8080:8080" to expose it directly.
    ports:
      - "127.0.0.1:${FLASHCERT_SHARE_PORT:-8080}:8080"
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
        required: false   # only with --profile postgres

  # Optional: `docker compose --profile postgres up -d`, with FLASHCERT_SHARE_DATABASE_URL set in .env.
  db:
    image: postgres:16-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: flashcert
      POSTGRES_USER: flashcert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flashcert"]
      interval: 10s

volumes:
  data:
  pgdata:
