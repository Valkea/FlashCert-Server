<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  {% block meta %}{% endblock %}
  <meta name="theme-color" content="#F7F7FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B13" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}?v={{ version }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='palettes.css') }}?v={{ version }}">
  <script src="{{ url_for('static', filename='appearance.js') }}?v={{ version }}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
  <symbol id="i-cap" viewBox="0 0 24 24"><path d="M22 10v6"/><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></symbol>
  <symbol id="i-quiz" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="14" rx="2"/><path d="M8 2h12a2 2 0 0 1 2 2v12"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-passage" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M8 7h8"/><path d="M8 11h6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
</svg>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{{ url_for('index') }}">{% include "_logo.html" %}{{ site_name }}</a>
    <div class="header-tools">
    <label class="palette-picker" hidden id="palette-control">
      <span class="sr-only">{{ t.palette }}</span>
      <select id="palette-select" aria-label="{{ t.palette }}">
        <option value="flashy">Flashy</option>
        <option value="ink">Ink</option>
        <option value="blue_orange">Blue / Orange</option>
        <option value="navy_gold">Navy / Gold</option>
        <option value="tangerine">Tangerine</option>
        <option value="violet">Violet</option>
        <option value="forest">Forest</option>
        <option value="coral">Coral</option>
        <option value="neon">Neon</option>
      </select>
    </label>
    <label class="palette-picker" hidden id="theme-control">
      <span class="sr-only">{{ t.appearance }}</span>
      <select id="theme-select" aria-label="{{ t.appearance }}">
        <option value="system">{{ t.theme_system }}</option>
        <option value="light">{{ t.theme_light }}</option>
        <option value="dark">{{ t.theme_dark }}</option>
      </select>
    </label>
    <button type="button" class="link-button" id="progress-open" hidden>
      <svg class="icon"><use href="#i-save"/></svg><span>{{ t.progress }}</span>
    </button>
    </div>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
{% include "_dialogs.html" %}
<script src="{{ url_for('static', filename='i18n.js') }}?v={{ version }}"></script>
<script src="{{ url_for('static', filename='progress.js') }}?v={{ version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
