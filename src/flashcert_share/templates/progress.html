{% extends "base.html" %}
{% block title %}{{ t.progress }} · {{ site_name }}{% endblock %}
{% block meta %}
  <meta name="robots" content="noindex">
{% endblock %}
{% block content %}
<section class="hero">
  <a class="back" href="{{ url_for('index') }}"><svg class="icon"><use href="#i-back"/></svg>{{ t.back }}</a>
  <h1><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg> {{ t.progress }}</h1>
</section>
<div class="panel stats" id="stats-page"></div>
<noscript><p class="empty">{{ t.noscript }}</p></noscript>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='stats.js') }}?v={{ version }}"></script>
<script src="{{ url_for('static', filename='progress-page.js') }}?v={{ version }}"></script>
{% endblock %}
