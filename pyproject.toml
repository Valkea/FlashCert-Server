[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "flashcert-share"
dynamic = ["version"]
description = "Read-only web sharing for FlashCert courses: notes, revision sheet, quizzes and flashcards, synced from the app."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Emmanuel Letremble" }]
classifiers = [
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
flashcert-share = "flashcert_share.cli:main"

[tool.hatch.version]
path = "src/flashcert_share/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flashcert_share"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "deploy", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
